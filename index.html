  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;line-height:1.7}

  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:32px;transition:.2s;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px}

  .card .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
  .card:nth-child(2) .tag{color:var(--accent2)}
  .card:nth-child(2) .tag::before{background:var(--accent2)}
  .footer{margin-top:48px;text-align:center;font-size:13px;color:var(--muted)}
  .coming{opacity:.4;pointer-events:none}
